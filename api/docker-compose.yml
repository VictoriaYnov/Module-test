services:

  db:
    image: mysql:9.2
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - 3306:3306
    volumes:
      - ../my-app/sqlfiles:/docker-entrypoint-initdb.d/
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysql -u root -p$$MYSQL_ROOT_PASSWORD -e 'USE ynov_ci' 2>/dev/null" ]
      interval: 5s
      retries: 20
      start_period: 30s

  api:
    image: api-ynov
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MYSQL_DATABASE=ynov_ci
      - MYSQL_USER=root
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - DB_HOST=db
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/users')\" 2>/dev/null || exit 1"]
      interval: 5s
      retries: 10
      start_period: 10s

  react:
    image: react-ynov
    build:
      context: ../my-app
      dockerfile: react.Dockerfile
    ports:
      - 3000:3000
    environment:
      - REACT_APP_SERVER_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    command: npm start

  adminer:
    depends_on:
      db:
        condition: service_healthy
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  mysql_data:
