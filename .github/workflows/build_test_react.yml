name: Build and Test React Application

on:
  push:
    branches: [ main ]

jobs:
  build_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [21.x]
    steps:
      - name: Clone repository
        uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: npm ci, doc, build and test
        working-directory: ./my-app
        env:
          REACT_APP_SERVER_URL: ${{ secrets.REACT_APP_SERVER_URL }}
        run: |
          npm ci
          npm run jsdoc
          npm run build --if-present
          npm test
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-app/build
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: my-app/coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  publish_npm:
    needs: build_test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: 21.x
          registry-url: 'https://registry.npmjs.org'
      - name: Check version and publish
        working-directory: ./my-app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          NPM_OUTPUT=$(npm show victoria-ynov version 2>&1)
          NPM_EXIT=$?

          if [ $NPM_EXIT -ne 0 ]; then
            if echo "$NPM_OUTPUT" | grep -q "E404"; then
              NPM_VERSION="0.0.0"
              echo "Package non encore publié, première publication."
            else
              echo "Erreur inattendue lors de la récupération de la version NPM :"
              echo "$NPM_OUTPUT"
              exit 1
            fi
          else
            NPM_VERSION="$NPM_OUTPUT"
          fi

          echo "Version locale : $LOCAL_VERSION — Version NPM : $NPM_VERSION"
          if [ "$(npx semver -r ">$NPM_VERSION" "$LOCAL_VERSION")" ]; then
            npm ci
            npm run build-npm-ci
            npm publish
          else
            echo "Version $LOCAL_VERSION déjà publiée ou non supérieure, skip."
          fi
  integration_test:
    needs: build_test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v2
      - name: Start services with docker-compose
        working-directory: ./api
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: docker compose up -d --build
      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/users > /dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
      - name: Check all containers are running
        working-directory: ./api
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          docker compose ps
          docker compose ps | grep -q "api" || (echo "FAIL: api container not running" && exit 1)
          docker compose ps | grep -q "db" || (echo "FAIL: db container not running" && exit 1)
          echo "All containers are running"
      - name: Test GET /users
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" http://localhost:8000/users)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL: HTTP $HTTP_CODE"
            exit 1
          fi
          BODY=$(cat /tmp/response.json)
          if [ "$BODY" = '{"utilisateurs":[]}' ]; then
            echo "FAIL: response is empty"
            exit 1
          fi
          echo "PASS: $BODY"
      - name: Wait for React to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "React is ready"
              break
            fi
            echo "Waiting for React... ($i/30)"
            sleep 2
          done
      - name: Cypress E2E - tests nominaux et 400 (API active)
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./my-app
          command: npx cypress run --spec cypress/e2e/api-up.cy.js
        env:
          REACT_APP_SERVER_URL: http://localhost:8000

      - name: Arrêt du conteneur API
        working-directory: ./api
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: docker compose stop api

      - name: Cypress E2E - tests 500 (API arrêtée)
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./my-app
          command: npx cypress run --spec cypress/e2e/api-down.cy.js
        env:
          REACT_APP_SERVER_URL: http://localhost:8000
      - name: Push API image to Docker Hub
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker tag api-ynov ${{ secrets.DOCKER_USERNAME }}/api-ynov:0.0.2
          docker push ${{ secrets.DOCKER_USERNAME }}/api-ynov:0.0.2

  deploy:
    needs: [publish_npm, integration_test]
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
