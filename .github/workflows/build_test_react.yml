name: Build and Test React Application

on:
  push:
    branches: [ main ]

jobs:
  build_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [21.x]
    steps:
      - name: Clone repository
        uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: npm ci, doc, build and test
        working-directory: ./my-app
        env:
          REACT_APP_SERVER_URL: ${{ secrets.REACT_APP_SERVER_URL }}
        run: |
          npm ci
          npm run jsdoc
          npm run build --if-present
          npm test
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./my-app
          build: npm run build
          start: npm start
        env:
          REACT_APP_SERVER_URL: ${{ secrets.REACT_APP_SERVER_URL }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-app/build
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: my-app/coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  publish-npm:
    needs: build_test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: 21.x
          registry-url: 'https://registry.npmjs.org'
      - name: Check version and publish
        working-directory: ./my-app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm show victoria-ynov version 2>/dev/null || echo "0.0.0")
          echo "Version locale : $LOCAL_VERSION — Version NPM : $NPM_VERSION"
          if [ "$(npx semver -r ">$NPM_VERSION" "$LOCAL_VERSION")" ]; then
            npm ci
            npm run build-npm-ci
            npm publish
          else
            echo "Version $LOCAL_VERSION déjà publiée ou non supérieure, skip."
          fi
  deploy:
    needs: publish-npm
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
